name: Release debug

on:
  push:
    tags:
      - 'debug-v*'

permissions:
  contents: write

concurrency:
  group: debug-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate immutable debug tag
        shell: pwsh
        env:
          DEBUG_TAG: ${{ github.ref_name }}
        run: |
          $build = Get-Content './build.gradle' -Raw
          if ($build -notmatch 'pluginVersionName\s*=\s*"([^"]+)"') { throw 'Cannot read component version.' }
          $version = $Matches[1]
          if ($env:DEBUG_TAG -notmatch '^debug-v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$' -or $env:DEBUG_TAG -cne "debug-v$version") {
            throw 'Debug tag must match debug-v<component version>, for example debug-v1.8.0.'
          }

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3
        with:
          gradle-version: '8.9'

      - name: Build plugin
        shell: pwsh
        run: gradle clean collectArtifacts

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-grant-${{ github.sha }}
          path: artifacts/accessibility-grant.atsplugin
          if-no-files-found: error

      - name: Prepare debug release assets
        shell: pwsh
        run: |
          .\.github\scripts\prepare-release.ps1 `
            -ArtifactPath .\artifacts\accessibility-grant.atsplugin `
            -OutputDirectory .\debug-dist `
            -Channel debug `
            -CommitSha '${{ github.sha }}'

      - name: Publish manually tagged debug release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\.github\scripts\publish-debug.ps1 -AssetDirectory .\debug-dist -Title 'Accessibility Grant Debug' -Tag '${{ github.ref_name }}'

      - name: Create registry app token
        id: registry-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
          owner: android-tool-suite
          repositories: plugin-registry
          permission-contents: write

      - name: Notify plugin registry
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.registry-app-token.outputs.token }}
        run: .\.github\scripts\dispatch-registry.ps1 -Channel debug -Reference '${{ github.ref_name }}'
