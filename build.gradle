plugins {
    id "base"
}

def pluginVersionName = "2.1.0"
def pluginVersionCode = 13
def minHostVersionCode = 23
def packageStaging = layout.buildDirectory.dir("generated/plugin-package")

def generatePluginManifest = tasks.register("generatePluginManifest") {
    inputs.property("pluginVersionName", pluginVersionName)
    inputs.property("pluginVersionCode", pluginVersionCode)
    inputs.property("minHostVersionCode", minHostVersionCode)
    inputs.file("src/manifest.template.json")
    outputs.file(packageStaging.map { it.file("manifest.json") })
    doLast {
        def output = packageStaging.get().file("manifest.json").asFile
        output.parentFile.mkdirs()
        output.setText(
                file("src/manifest.template.json").getText("UTF-8")
                        .replace("@VERSION_NAME@", pluginVersionName)
                        .replace("@VERSION_CODE@", pluginVersionCode.toString())
                        .replace("@MIN_HOST_VERSION_CODE@", minHostVersionCode.toString()),
                "UTF-8"
        )
    }
}

def preparePluginPackage = tasks.register("preparePluginPackage") {
    dependsOn generatePluginManifest
    inputs.dir("src/web")
    inputs.dir("src/ui")
    inputs.dir("src/workers")
    outputs.dir(packageStaging)
    doLast {
        def root = packageStaging.get().asFile
        delete new File(root, "web"), new File(root, "ui"), new File(root, "workers"), new File(root, "META-INF")
        copy { from("src/web"); into(new File(root, "web")) }
        copy { from("src/ui"); into(new File(root, "ui")) }
        copy { from("src/workers"); into(new File(root, "workers")) }
        def payloads = fileTree(root).matching { exclude "META-INF/**" }.files
                .sort { left, right -> root.toPath().relativize(left.toPath()).toString() <=> root.toPath().relativize(right.toPath()).toString() }
        def files = payloads.collect { item ->
            def bytes = item.bytes
            def digest = java.security.MessageDigest.getInstance("SHA-256").digest(bytes)
                    .collect { String.format(java.util.Locale.ROOT, "%02x", it & 0xff) }.join()
            [
                    path: root.toPath().relativize(item.toPath()).toString().replace('\\', '/'),
                    sha256: digest,
                    size: bytes.length,
            ]
        }
        def meta = new File(root, "META-INF")
        meta.mkdirs()
        new File(meta, "ats-integrity.json").setText(
                groovy.json.JsonOutput.toJson([algorithm: "sha256", files: files, formatVersion: 1]) + "\n",
                "UTF-8"
        )
    }
}

def registerPluginPackage = { String taskName, String outputPath ->
    tasks.register(taskName) {
        dependsOn preparePluginPackage
        def archive = layout.buildDirectory.file(outputPath)
        inputs.dir(packageStaging)
        outputs.file(archive)
        doLast {
            def root = packageStaging.get().asFile
            def destination = archive.get().asFile
            destination.parentFile.mkdirs()
            new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(destination)).withCloseable { zip ->
                fileTree(root).files
                        .findAll { it.isFile() }
                        .sort { left, right -> root.toPath().relativize(left.toPath()).toString() <=> root.toPath().relativize(right.toPath()).toString() }
                        .each { item ->
                            def relative = root.toPath().relativize(item.toPath()).toString().replace('\\', '/')
                            def entry = new java.util.zip.ZipEntry(relative)
                            entry.time = 0L
                            zip.putNextEntry(entry)
                            item.withInputStream { input -> input.transferTo(zip) }
                            zip.closeEntry()
                        }
            }
        }
    }
}

registerPluginPackage("packageReleasePlugin", "outputs/atsplugin/release/accessibility-grant.atsplugin")
registerPluginPackage("packagePlugin", "outputs/atsplugin/accessibility-grant.atsplugin")

tasks.register("collectArtifacts", Copy) {
    dependsOn "packagePlugin"
    group = "distribution"
    description = "Collects the accessibility plugin package in the root artifacts directory."
    into layout.projectDirectory.dir("artifacts")
    from(layout.buildDirectory.dir("outputs/atsplugin")) {
        include "accessibility-grant.atsplugin"
    }
}
