plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def pluginVersionName = "2.0.0"
def pluginVersionCode = 12
def minHostVersionCode = 23
def pluginSdkVersion = providers.gradleProperty("atsPluginSdkVersion").get()

android {
    namespace "com.androidtoolsuite.app.plugin.accessibility"
    compileSdk 35

    defaultConfig {
        applicationId "com.androidtoolsuite.app.plugin.accessibility"
        minSdk 24
        targetSdk 35
        versionCode pluginVersionCode
        versionName pluginVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        compose true
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    compileOnly "com.androidtoolsuite:plugin-sdk:$pluginSdkVersion"
    testImplementation "com.androidtoolsuite:plugin-sdk:$pluginSdkVersion"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

def runtimeV2Staging = layout.buildDirectory.dir("generated/runtimeV2Package")

def generatePluginManifest = tasks.register("generatePluginManifest") {
    inputs.property("pluginVersionName", pluginVersionName)
    inputs.property("pluginVersionCode", pluginVersionCode)
    inputs.property("minHostVersionCode", minHostVersionCode)
    inputs.property("pluginSdkVersion", pluginSdkVersion)
    inputs.file("runtime-v2/manifest.template.json")
    outputs.file(runtimeV2Staging.map { it.file("manifest.json") })
    doLast {
        def output = runtimeV2Staging.get().file("manifest.json").asFile
        output.parentFile.mkdirs()
        output.setText(
                file("runtime-v2/manifest.template.json").getText("UTF-8")
                        .replace("@VERSION_NAME@", pluginVersionName)
                        .replace("@VERSION_CODE@", pluginVersionCode.toString())
                        .replace("@MIN_HOST_VERSION_CODE@", minHostVersionCode.toString()),
                "UTF-8"
        )
    }
}

def prepareRuntimeV2Package = tasks.register("prepareRuntimeV2Package") {
    dependsOn generatePluginManifest
    inputs.dir("runtime-v2/web")
    inputs.dir("runtime-v2/ui")
    inputs.dir("runtime-v2/workers")
    outputs.dir(runtimeV2Staging)
    doLast {
        def root = runtimeV2Staging.get().asFile
        delete new File(root, "web"), new File(root, "ui"), new File(root, "workers"), new File(root, "META-INF")
        copy { from("runtime-v2/web"); into(new File(root, "web")) }
        copy { from("runtime-v2/ui"); into(new File(root, "ui")) }
        copy { from("runtime-v2/workers"); into(new File(root, "workers")) }
        def payloads = fileTree(root).matching { exclude "META-INF/**" }.files
                .sort { left, right -> root.toPath().relativize(left.toPath()).toString() <=> root.toPath().relativize(right.toPath()).toString() }
        def files = payloads.collect { item ->
            def bytes = item.bytes
            def digest = java.security.MessageDigest.getInstance("SHA-256").digest(bytes)
                    .collect { String.format(java.util.Locale.ROOT, "%02x", it & 0xff) }.join()
            [
                    path: root.toPath().relativize(item.toPath()).toString().replace('\\', '/'),
                    sha256: digest,
                    size: bytes.length,
            ]
        }
        def meta = new File(root, "META-INF")
        meta.mkdirs()
        new File(meta, "ats-integrity.json").setText(
                groovy.json.JsonOutput.toJson([algorithm: "sha256", files: files, formatVersion: 1]) + "\n",
                "UTF-8"
        )
    }
}

def registerRuntimeV2Package = { String taskName, String outputPath, String assembleTask ->
    tasks.register(taskName) {
        dependsOn assembleTask, prepareRuntimeV2Package
        def archive = layout.buildDirectory.file(outputPath)
        inputs.dir(runtimeV2Staging)
        outputs.file(archive)
        doLast {
            def root = runtimeV2Staging.get().asFile
            def destination = archive.get().asFile
            destination.parentFile.mkdirs()
            new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(destination)).withCloseable { zip ->
                fileTree(root).files
                        .findAll { it.isFile() }
                        .sort { left, right -> root.toPath().relativize(left.toPath()).toString() <=> root.toPath().relativize(right.toPath()).toString() }
                        .each { item ->
                            def relative = root.toPath().relativize(item.toPath()).toString().replace('\\', '/')
                            def entry = new java.util.zip.ZipEntry(relative)
                            entry.time = 0L
                            zip.putNextEntry(entry)
                            item.withInputStream { input -> input.transferTo(zip) }
                            zip.closeEntry()
                        }
            }
        }
    }
}

registerRuntimeV2Package("packageReleasePlugin", "outputs/atsplugin/release/accessibility-grant.atsplugin", "assembleRelease")
registerRuntimeV2Package("packagePlugin", "outputs/atsplugin/accessibility-grant.atsplugin", "assembleDebug")

tasks.register("collectArtifacts", Copy) {
    dependsOn "packagePlugin"
    group = "distribution"
    description = "Collects the accessibility plugin package in the root artifacts directory."
    into layout.projectDirectory.dir("artifacts")
    from(layout.buildDirectory.dir("outputs/atsplugin")) {
        include "accessibility-grant.atsplugin"
    }
}
