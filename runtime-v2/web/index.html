<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>无障碍授权</title>
    <link rel="stylesheet" href="/__ats__/theme.css">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <section class="notice warning">
        无障碍服务可以读取屏幕内容并执行点击、滑动等操作，请只为完全信任的应用授权。
      </section>

      <section id="connection-card" class="card connection" aria-live="polite">
        <svg class="status-icon" viewBox="0 0 24 24" aria-hidden="true"><path></path></svg>
        <div><h2 id="connection-title">正在检查连接</h2><p id="connection-detail">请稍候</p></div>
      </section>

      <section class="card controls">
        <h2>查找与自动启用</h2>
        <label for="query">搜索应用、服务或包名</label>
        <input id="query" type="search" autocomplete="off" placeholder="输入关键词">
        <div class="control-row">
          <button id="favorites-only" class="chip" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35 10.55 20.03C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09A6.02 6.02 0 0 1 16.5 3C19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35Z"/></svg>
            仅看收藏
          </button>
          <div class="grow"><strong>自动启用收藏</strong><small>打开本应用时检查，并定期重新启用</small></div>
          <label class="switch"><input id="auto-grant" type="checkbox"><span aria-hidden="true"></span></label>
        </div>
      </section>

      <section class="list-section">
        <div class="section-header compact">
          <div><h2>无障碍服务</h2><p id="summary">等待读取设备服务</p></div>
          <button id="refresh" class="icon-button" type="button" aria-label="刷新">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.09A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h8V3l-3.35 3.35Z"/></svg>
          </button>
        </div>
        <div id="progress" class="progress" hidden><span></span></div>
        <div id="message" class="empty" hidden></div>
        <div id="services" class="service-list"></div>
      </section>
    </main>
  </body>
</html>
